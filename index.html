<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="georoute-base" content="" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('georoute_theme');
          var isDark = saved !== 'light';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>GeoRoute Manager — کنترل‌پنل چندپروژه‌ای GeoDNS و پروکسی</title>
    <meta
      name="description"
      content="Multi-project GeoDNS, Cloudflare discovery, and Iran static-asset proxy infrastructure control panel."
    />
    <meta property="og:title" content="GeoRoute Manager — Multi-Project GeoDNS &amp; Proxy Control Plane" />
    <meta
      property="og:description"
      content="Multi-project GeoDNS, Cloudflare discovery, and Iran static-asset proxy infrastructure control panel."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
