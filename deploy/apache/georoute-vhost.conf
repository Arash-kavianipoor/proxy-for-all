# Apache 2.4 VirtualHost for GeoRoute Manager
# Use this when replacing an old WordPress VirtualHost on your domain or subdomain.
#
# Required Apache modules:
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName panel.example.com
    # If replacing WordPress on the main domain, use:
    # ServerName example.com
    # ServerAlias www.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/georoute-error.log
    CustomLog ${APACHE_LOG_DIR}/georoute-access.log combined
</VirtualHost>

# After running `sudo certbot --apache -d panel.example.com`, Certbot creates/updates
# the *:443 SSL VirtualHost automatically. If configuring SSL manually, use:
#
# <VirtualHost *:443>
#     ServerName panel.example.com
#
#     SSLEngine on
#     SSLCertificateFile /etc/letsencrypt/live/panel.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/panel.example.com/privkey.pem
#
#     ProxyPreserveHost On
#     ProxyRequests Off
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Forwarded-Port "443"
#
#     ProxyPass / http://127.0.0.1:3000/
#     ProxyPassReverse / http://127.0.0.1:3000/
# </VirtualHost>
