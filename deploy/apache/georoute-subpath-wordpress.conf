# Apache 2.4 Subpath Configuration — Coexisting with an Existing WordPress Site
# Mounts GeoRoute Manager at https://example.com/georoute/ while keeping WordPress at /
#
# Step 1: Set BASE_PATH=/georoute in /opt/georoute-manager/.env
# Step 2: Include this block inside your existing Apache <VirtualHost *:80> and <VirtualHost *:443>
# Step 3: Add `RewriteCond %{REQUEST_URI} !^/georoute` BEFORE WordPress's `RewriteRule . /index.php [L]`
#         inside your WordPress .htaccess file so WordPress does not hijack /georoute requests.

ProxyPreserveHost On
ProxyRequests Off

<Location "/georoute">
    ProxyPass "http://127.0.0.1:3000/georoute"
    ProxyPassReverse "http://127.0.0.1:3000/georoute"
    RequestHeader set X-Forwarded-Prefix "/georoute"
    # On your *:443 VirtualHost change "http" to "https"
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
</Location>
